<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Torrential Player</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>

        body {

            margin: 0;

            background: #000;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: black;
        }

    </style>

</head>

<body>

    <video
        id="video"
        controls
        autoplay
        playsinline
    ></video>

    <script>

        const PLAYLIST_URL =
            //"https://streamdeck-worker4.imsawant05.workers.dev/media/e1b262e1ab5d98fad3271ead0add9b5e21e2cc95/master.m3u8";
            "https://streamdeck-worker4.imsawant05.workers.dev/media/1771360edb627d2fee9932c8946f4875efd99ba5/master.m3u8";

        const video =
            document.getElementById(
                "video"
            );

        if (
            Hls.isSupported()
        ) {

            const hls = new Hls({

                enableWorker: true,

                lowLatencyMode: false,

                backBufferLength: 600,

                maxBufferLength: 120,

                maxMaxBufferLength: 300,

                liveDurationInfinity: false,
            });

            hls.loadSource(
                PLAYLIST_URL
            );

            hls.attachMedia(
                video
            );

            hls.on(

                Hls.Events.MANIFEST_PARSED,

                () => {

                    console.log(
                        "Manifest loaded"
                    );

                    video.play()
                        .catch(
                            console.error
                        );
                }
            );

            hls.on(

                Hls.Events.ERROR,

                (event, data) => {

                    console.error(
                        "HLS ERROR",
                        data
                    );
                }
            );
        }

        else if (

            video.canPlayType(
                "application/vnd.apple.mpegurl"
            )

        ) {

            video.src =
                PLAYLIST_URL;

            video.addEventListener(

                "loadedmetadata",

                () => {

                    video.play()
                        .catch(
                            console.error
                        );
                }
            );
        }

        else {

            alert(
                "HLS unsupported"
            );
        }

    </script>

</body>

</html>
